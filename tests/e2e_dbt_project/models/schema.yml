version: 2

models:
  - name: one
    config:
      tags: "{{ var('one_tags', []) }}"
      meta:
        owner: "{{ var('one_owner', none) }}"
    columns:
      - name: col1
        tests:
          - accepted_values:
              config:
                meta:
                  owner: "@elon"
              arguments:
                values: [2, 3]

  - name: any_type_column_anomalies
    description: >
      This is a very weird description
      with breaklines
      and comma,
      and even a string like this 'wow'. You know, these $##$34#@#!^ can also be helpful
      WDYT?
    config:
      meta:
        elementary:
          timestamp_column: updated_at
        owner: ["@edr"]
        subscribers: "@egk"
    tests:
      - elementary.volume_anomalies:
          config:
            severity: warn
            meta:
              description: >
                This is a very weird description
                with breaklines
                and comma,
                and even a string like this 'wow'. You know, these $##$34#@#!^ can also be helpful
                WDYT?
            tags: ["table_anomalies"]
          arguments:
            time_bucket:
              period: hour
              count: 4
      - elementary.volume_anomalies:
          config:
            severity: warn
            where: 1=1
            tags: ["table_anomalies"]
          arguments:
            time_bucket:
              period: week
              count: 1
      - elementary.all_columns_anomalies:
          config:
            tags: ["all_any_type_columns_anomalies", "column_anomalies"]
          arguments:
            exclude_regexp: ".*column1|column2|column3|column4|column5|column6|column7|column8|column9|column10|column11|column12|column13|column14|column15|column16|column17.*"
      - generic_test_on_model:
          config:
            tags: ["regular_tests"]
      - elementary.all_columns_anomalies:
          config:
            where: 1=1
            tags: ["directional_anomalies", "drop"]
          arguments:
            anomaly_direction: "drop"
      - elementary.all_columns_anomalies:
          config:
            tags: ["directional_anomalies", "spike"]
          arguments:
            anomaly_direction: "spike"

  - name: no_timestamp_anomalies
    description: We use this model to test anomalies when there is no timestamp column
    tests:
      - elementary.volume_anomalies:
          config:
            tags: ["no_timestamp"]

    columns:
      - name: "null_count_str"
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["no_timestamp"]
                where: 1=1
              arguments:
                column_anomalies:
                  - null_count

    config:
      meta:
        owner: "elon@elementary-data.com, or@elementary-data.com"
        subscribers: ["elon@elementary-data.com"]
        description: This is a description.
  - name: dimension_anomalies
    description: We use this model to test dimension anomalies
    tests:
      - elementary.dimension_anomalies:
          config:
            tags: ["dimension_anomalies", "should_fail"]
            alias: "dimension_anomalies_platform"
            where: 1=1
          arguments:
            timestamp_column: updated_at
            dimensions:
              - platform
      - elementary.dimension_anomalies:
          config:
            alias: "dimension_anomalies_platform_where_expression"
            tags: ["dimension_anomalies"]
          arguments:
            timestamp_column: updated_at
            dimensions:
              - platform
            where_expression: "platform = 'android'"
      - elementary.dimension_anomalies:
          config:
            alias: "dimension_anomalies_platform_new_dimension"
            tags: ["dimension_anomalies"]
          arguments:
            timestamp_column: updated_at
            dimensions:
              - platform
            where_expression: "platform = 'windows'"
      - elementary.dimension_anomalies:
          config:
            alias: "dimension_anomalies_platform_new_dimension_no_timestamp"
            tags: ["dimension_anomalies"]
          arguments:
            dimensions:
              - platform
            where_expression: "platform = 'windows'"
      - elementary.dimension_anomalies:
          config:
            tags: ["dimension_anomalies", "should_fail"]
            alias: "dimension_anomalies_platform_version"
          arguments:
            timestamp_column: updated_at
            dimensions:
              - platform
              - version
      - elementary.dimension_anomalies:
          config:
            tags: ["directional_anomalies", "spike"]
          arguments:
            anomaly_direction: "spike"
            timestamp_column: updated_at
            dimensions:
              - platform
      - elementary.dimension_anomalies:
          config:
            tags: ["directional_anomalies", "drop"]
          arguments:
            anomaly_direction: "drop"
            timestamp_column: updated_at
            dimensions:
              - platform
      - elementary.dimension_anomalies:
          config:
            tags: ["dimension_anomalies"]
            alias: "dimension_anomalies_no_timestamp"
          arguments:
            dimensions:
              - platform
    config:
      meta:
        owner: "egk"
        subscribers: "elon, egk"
  - name: error_model
    description: We use this model to create error runs and tests
    config:
      tags: ["error_model"]
      meta:
        owner: ["elon@elementary-data.com", "@elon", "egk"]
    columns:
      - name: "missing_column"
        tests:
          - uniques:
              config:
                tags: ["error_test", "regular_tests"]

  - name: backfill_days_column_anomalies
    config:
      meta:
        elementary:
          timestamp_column: updated_at
    columns:
      - name: "min_length"
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["backfill_days"]
              arguments:
                column_anomalies:
                  - min_length
                  - max_length
          - elementary.column_anomalies:
              config:
                tags: ["backfill_days"]
              arguments:
                backfill_days: 7
                column_anomalies:
                  - min_length
                  - max_length

  - name: string_column_anomalies
    config:
      meta:
        elementary:
          timestamp_column: updated_at
        owner: "@or"
        tags: ["marketing"]
    tests:
      - elementary.freshness_anomalies:
          config:
            tags: ["table_anomalies"]
      - elementary.event_freshness_anomalies:
          config:
            tags: ["event_freshness_anomalies"]
          arguments:
            event_timestamp_column: occurred_at
            update_timestamp_column: updated_at
      - elementary.all_columns_anomalies:
          config:
            tags: ["string_column_anomalies", "column_anomalies"]
      - elementary.schema_changes:
          config:
            where: 1=1
            tags: ["schema_changes"]
    columns:
      - name: "min_length"
        tests:
          - relationships:
              config:
                tags: ["regular_tests"]
              arguments:
                to: source('training', 'string_column_anomalies_training')
                field: max_length
          - elementary.column_anomalies:
              config:
                tags: ["string_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - min_length
                  - max_length
                  - missing_count
      - name: max_length
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["string_column_anomalies", "column_anomalies"]
      - name: average_length
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["string_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - average_length
                  - null_count
      - name: missing_count
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["string_column_anomalies", "column_anomalies"]
      - name: missing_percent
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["string_column_anomalies", "column_anomalies"]
      - name: updated_at
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["string_column_anomalies", "column_anomalies"]

  - name: numeric_column_anomalies
    config:
      meta:
        elementary:
          timestamp_column: updated_at
    tests:
      - elementary.volume_anomalies:
          config:
            tags: ["table_anomalies"]
      - elementary.volume_anomalies:
          config:
            tags: ["directional_anomalies", "drop"]
          arguments:
            anomaly_direction: "drop"
      - elementary.volume_anomalies:
          config:
            tags: ["directional_anomalies", "spike"]
          arguments:
            anomaly_direction: "spike"
      - elementary.freshness_anomalies:
          config:
            tags: ["table_anomalies"]
      - elementary.event_freshness_anomalies:
          config:
            tags: ["event_freshness_anomalies"]
          arguments:
            event_timestamp_column: occurred_at
            update_timestamp_column: updated_at
      - elementary.schema_changes:
          config:
            tags: ["schema_changes"]
      - elementary.all_columns_anomalies:
          config:
            tags: ["all_numeric_columns_anomalies"]
          arguments:
            column_anomalies:
              - average_length
              - null_count
    columns:
      - name: min_val
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - min
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - max
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - average
      - name: max_val
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - min
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - max
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - average
          - elementary.column_anomalies:
              config:
                tags: ["directional_anomalies", "spike"]
              arguments:
                column_anomalies:
                  - average
                anomaly_direction: "spike"
          - elementary.column_anomalies:
              config:
                tags: ["directional_anomalies", "drop"]
              arguments:
                column_anomalies:
                  - average
                anomaly_direction: "drop"
      - name: average
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - min
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - max
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - average
      - name: zero_count
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
      - name: zero_percent
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
      - name: updated_at
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
      - name: variance
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
      - name: standard_deviation
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
      - name: sum_val
        tests:
          - elementary.column_anomalies:
              config:
                tags: ["numeric_column_anomalies", "column_anomalies"]
              arguments:
                column_anomalies:
                  - sum

  - name: copy_numeric_column_anomalies
    config:
      meta:
        elementary:
          timestamp_column: updated_at
    tests:
      - elementary.all_columns_anomalies:
          config:
            tags: ["numeric_column_anomalies", "column_anomalies"]
          arguments:
            column_anomalies:
              - zero_count

  - name: groups
    columns:
      - name: group_a
        data_type: "{{ 'strIng' if (target.type == 'bigquery' or target.type == 'databricks' or target.type == 'athena' or target.type == 'spark') else 'varchar' if (target.type == 'trino' or target.type == 'dremio' or target.type == 'duckdb' or target.type == 'fabric' or target.type == 'sqlserver') else 'CHArACTER varying' if target.type == 'redshift' else 'teXt' }}"
      - name: group_b
        data_type: double
      - name: group_c
    tests:
      - elementary.schema_changes:
          config:
            tags: ["schema_changes"]
      - elementary.schema_changes_from_baseline:
          config:
            where: 1=1
            tags: ["schema_changes_from_baseline"]
          arguments:
            fail_on_added: true
      - elementary.schema_changes_from_baseline:
          config:
            tags: ["schema_changes_from_baseline", "error_test"]
          arguments:
            enforce_types: true
  - name: stats_players
    columns:
      - name: player
        data_type: "{{ 'STRING' if (target.type == 'bigquery' or target.type == 'databricks' or target.type == 'athena' or target.type == 'spark') else 'varchar' if (target.type == 'trino' or target.type == 'dremio' or target.type == 'duckdb' or target.type == 'fabric' or target.type == 'sqlserver') else 'character varying' if target.type == 'redshift' else 'TEXT' }}"
      - name: goals
        data_type: BOOLEAN
      - name: coffee_cups_consumed
        data_type: INTEGER
    tests:
      - elementary.schema_changes:
          config:
            tags: ["schema_changes"]
      - elementary.schema_changes_from_baseline:
          config:
            tags: ["schema_changes_from_baseline"]
      - elementary.schema_changes_from_baseline:
          config:
            tags: ["schema_changes_from_baseline"]
          arguments:
            enforce_types: true
  - name: stats_team
    tests:
      - elementary.schema_changes:
          config:
            tags: ["schema_changes"]

  - name: users_per_day_weekly_seasonal
    config:
      meta:
        elementary:
          backfill_days: 14
    tests:
      - elementary.volume_anomalies:
          config:
            alias: day_of_week_volume_anomalies_no_seasonality
            tags: ["seasonality_volume", "table_anomalies"]
          arguments:
            timestamp_column: "updated_at"
            sensitivity: 2
      - elementary.volume_anomalies:
          config:
            alias: day_of_week_volume_anomalies_with_seasonality
            tags: ["seasonality_volume", "table_anomalies"]
          arguments:
            timestamp_column: "updated_at"
            sensitivity: 2
            seasonality: day_of_week
      - elementary.volume_anomalies:
          config:
            alias: hour_of_week_volume_anomalies_no_seasonality
            tags: ["seasonality_volume", "table_anomalies"]
          arguments:
            timestamp_column: "updated_at"
            sensitivity: 2
            time_bucket:
              period: hour
              count: 1
      - elementary.volume_anomalies:
          config:
            alias: hour_of_week_volume_anomalies_with_seasonality
            tags: ["seasonality_volume", "table_anomalies"]
          arguments:
            timestamp_column: "updated_at"
            sensitivity: 2
            time_bucket:
              period: hour
              count: 1
            seasonality: hour_of_week
  - name: users_per_hour_daily_seasonal
    tests:
      - elementary.volume_anomalies:
          config:
            alias: hour_of_day_volume_anomalies_no_seasonality
            tags: ["seasonality_volume", "table_anomalies"]
          arguments:
            timestamp_column: "updated_at"
            sensitivity: 2
            time_bucket:
              period: hour
              count: 1
      - elementary.volume_anomalies:
          config:
            alias: hour_of_day_volume_anomalies_with_seasonality
            tags: ["seasonality_volume", "table_anomalies"]
          arguments:
            timestamp_column: "updated_at"
            sensitivity: 2
            time_bucket:
              period: hour
              count: 1
            seasonality: hour_of_day
  - name: ephemeral_model
    config:
      meta:
        elementary:
          timestamp_column: updated_at
    tests:
      - elementary.volume_anomalies:
          config:
            tags: ["ephemeral_model", "error_test"]
      - elementary.all_columns_anomalies:
          config:
            tags: ["ephemeral_model", "error_test"]
      - elementary.freshness_anomalies:
          config:
            where: 1=1
            tags: ["ephemeral_model", "error_test"]
      - elementary.schema_changes:
          config:
            tags: ["ephemeral_model", "error_test"]

  - name: config_levels_test_and_model
    config:
      meta:
        elementary:
          min_training_set_size: 22
          days_back: 100
          backfill_days: 10
          anomaly_direction: "drop"
          anomaly_sensitivity: 4
          where_expression: "true"
          timestamp_column: "updated_at"
          time_bucket:
            period: hour
            count: 4
      tags: ["config_levels"]
    tests:
      - config_levels:
          config:
            tags: ["config_levels"]
            alias: "test_level_config"
          arguments:
            min_training_set_size: 18
            days_back: 5
            backfill_days: 5
            seasonality: "day_of_week"
            anomaly_direction: "spike"
            anomaly_sensitivity: 5
            where_expression: "1=1"
            timestamp_column: "occurred_at"
            time_bucket:
              period: day
              count: 1
            expected_config: ## Test level expected config
              seasonality: "day_of_week"
              min_training_set_size: 18
              days_back: 35 ## *7 because of seasonality
              backfill_days: 5
              anomaly_direction: "spike"
              anomaly_sensitivity: 5
              where_expression: "1=1"
              timestamp_column: "occurred_at"
              time_bucket:
                period: day
                count: 1
      - config_levels:
          config:
            tags: ["config_levels"]
            alias: "model_level_config"
          arguments:
            expected_config: ## Model level expected config
              min_training_set_size: 22
              seasonality:
              days_back: 100
              backfill_days: 10
              anomaly_direction: "drop"
              anomaly_sensitivity: 4
              where_expression: "true"
              timestamp_column: "updated_at"
              time_bucket:
                period: hour
                count: 4
  - name: config_levels_project
    tests:
      - config_levels:
          config:
            tags: ["config_levels"]
            alias: "project_level_config"
          arguments:
            expected_config: ## Project level expected config
              min_training_set_size: 14
              seasonality:
              days_back: 30
              backfill_days: 2
              anomaly_direction: both
              anomaly_sensitivity: 3
              where_expression:
              timestamp_column:
              time_bucket:
                period: day
                count: 1

    config:
      tags: ["config_levels"]
sources:
  - name: training
    schema: "{{ target.schema if target.type == 'dremio' else 'test_seeds' }}"
    tables:
      - name: users_per_hour_daily_seasonal_training
        columns:
          - name: "user_id"
            tests:
              - relationships:
                  config:
                    tags: ["regular_tests"]
                  arguments:
                    to: source('training', 'users_per_day_weekly_seasonal_training')
                    field: user_id
      - name: any_type_column_anomalies_training
        tests:
          - elementary.volume_anomalies:
              config:
                tags: ["table_anomalies"]
          - elementary.freshness_anomalies:
              config:
                tags: ["table_anomalies", "error_test"]
          - elementary.event_freshness_anomalies:
              config:
                tags: ["event_freshness_anomalies"]
              arguments:
                event_timestamp_column: occurred_at
        config:
          freshness:
            error_after:
              count: 1
              period: minute
          loaded_at_field: updated_at
          meta:
            owner: ["@edr", "egk"]
      - name: string_column_anomalies_training
        tests:
          - elementary.volume_anomalies:
              config:
                tags: ["table_anomalies"]
          - elementary.freshness_anomalies:
              config:
                tags: ["table_anomalies"]
          - elementary.event_freshness_anomalies:
              config:
                tags: ["event_freshness_anomalies"]
              arguments:
                event_timestamp_column: occurred_at
                update_timestamp_column: updated_at
        config:
          freshness:
            error_after:
              count: 1
              period: minute
          loaded_at_field: no_such_column
          meta:
            owner: "@edr"
            elementary:
              timestamp_column: updated_at
      - name: numeric_column_anomalies_training
        tests:
          - config_levels:
              config:
                tags: ["config_levels"]
                alias: "test_level_config"
              arguments:
                min_training_set_size: 18
                days_back: 5
                backfill_days: 5
                seasonality: "day_of_week"
                anomaly_direction: "spike"
                anomaly_sensitivity: 5
                where_expression: "1=1"
                timestamp_column: "occurred_at"
                time_bucket:
                  period: day
                  count: 1
                expected_config: ## Test level expected config
                  seasonality: "day_of_week"
                  min_training_set_size: 18
                  days_back: 35 ## *7 because of seasonality
                  backfill_days: 5
                  anomaly_direction: "spike"
                  anomaly_sensitivity: 5
                  where_expression: "1=1"
                  timestamp_column: "occurred_at"
                  time_bucket:
                    period: day
                    count: 1
          - config_levels:
              config:
                tags: ["config_levels"]
                alias: "model_level_config"
              arguments:
                expected_config: ## Model level expected config
                  min_training_set_size: 22
                  seasonality:
                  days_back: 100
                  backfill_days: 10
                  anomaly_direction: "drop"
                  anomaly_sensitivity: 4
                  where_expression: "true"
                  timestamp_column: "updated_at"
                  time_bucket:
                    period: hour
                    count: 4

        config:
          meta:
            elementary:
              min_training_set_size: 22
              days_back: 100
              backfill_days: 10
              anomaly_direction: "drop"
              anomaly_sensitivity: 4
              where_expression: "true"
              timestamp_column: "updated_at"
              time_bucket:
                period: hour
                count: 4
      - name: users_per_day_weekly_seasonal_training
  - name: validation
    schema: "{{ target.schema if target.type == 'dremio' else 'test_seeds' }}"
    tables:
      - name: users_per_hour_daily_seasonal_validation
      - name: any_type_column_anomalies_validation
        tests:
          - elementary.all_columns_anomalies:
              config:
                tags: ["elementary_source"]
        columns:
          - name: null_count_int
            tests:
              - generic_test_on_column:
                  config:
                    tags: ["regular_tests"]
        config:
          freshness:
            warn_after:
              count: 1
              period: minute
          loaded_at_field: updated_at
          meta:
            owner: "hello, world"
      - name: users_per_day_weekly_seasonal_validation

exposures:
  - name: elementary_exposure
    type: application
    maturity: medium
    url: https://elementary.not.really
    description: >
      Keep calm, Elementary tests exposures.
    depends_on:
      - ref('error_model')
      - source('training', 'any_type_column_anomalies_training')
    owner:
      name: Complete Nonsense
      email: fake@fakerson.com
    config:
      tags:
        - marketing

  - name: weekly_jaffle_metrics
    type: dashboard
    maturity: high
    url: https://bi.tool/dashboards/1
    description: >
      Did someone say "exponential growth"?
    depends_on:
      - ref('string_column_anomalies')
      - ref('numeric_column_anomalies')
    owner:
      name: Claire from Data
      email: data@jaffleshop.com
    config:
      tags:
        - hack
        - the
        - planet
      meta:
        platform: Tableau
        workbook: By the Week
        path: ByTheWeek/Jaffles
  - name: monthly_jaffle_metrics
    type: dashboard
    maturity: high
    url: https://bi.tool/dashboards/2
    description: >
      Did someone say "exponential growth"?
    depends_on:
      - ref('string_column_anomalies')
      - ref('numeric_column_anomalies')
    owner:
      name: Claire from Data
      email: data@jaffleshop.com
    config:
      tags:
        - hack
        - the
        - planet
      meta:
        platform: Looker
        workbook: By the Month
        path: ByTheMonth/Jaffles
  - name: daily_jaffle_metrics
    type: dashboard
    maturity: high
    url: https://bi.tool/dashboards/3
    description: >
      Did someone say "exponential growth"?
    depends_on:
