name: "elementary_integration_tests"
version: "1.0.0"
config-version: 2
profile: "elementary_tests"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "dbt_modules"

vars:
  days_back: 30
  debug_logs: "{{ env_var('DBT_EDR_DEBUG', False) }}"
  custom_run_started_at: "1970-01-01 00:00:00"
  clean_elementary_temp_tables: false
  disable_dbt_artifacts_autoupload: true

seeds:
  +schema: test_seeds

models:
  elementary_integration_tests:
    +file_format: "{{ 'delta' if target.type == 'spark' else none }}"

  elementary:
    +schema: elementary
    +file_format: "{{ 'delta' if target.type == 'spark' else none }}"
    # dbt-dremio config; rejected by dbt 2.0 (Fusion), which doesn't support
    # Dremio - the CI strips it for dbt 2.x targets.
    +root_path: elementary
# This flag and the 'arguments:' syntax in the schema files require
# dbt-core >= 1.10.5 (or dbt 2.x), so that's the minimum for running the E2E
# project (the elementary package itself still supports dbt-core >= 1.8).
flags:
  require_generic_test_arguments_property: true
