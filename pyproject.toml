[project]
name = "elementary-data"
version = "0.25.1"
description = "Data monitoring and lineage"
authors = [{ name = "Elementary" }]
keywords = ["data", "lineage", "data lineage", "data warehouse", "DWH", "observability", "data monitoring", "data observability", "Snowflake", "BigQuery", "Redshift", "data reliability", "analytics engineering"]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "click>=7.0,<9.0",
    "dbt-core>=1.8,<2.0.0",
    "requests>=2.28.1,<3.0.0",
    "beautifulsoup4<5.0.0",
    "ratelimit",
    "posthog<3.0.0",
    "boto3<2.0.0",
    "google-cloud-storage>=2.4,<3.2",
    "ruamel.yaml<1.0.0",
    "alive-progress<=2.3.1",
    "slack-sdk>=3.20.1,<4.0.0",
    "lxml>=6.1.0",
    "pydantic<3.0",
    "networkx>=2.3,<3",
    "packaging>=20.9",
    "azure-storage-blob>=12.11.0",
    "pymsteams>=0.2.2,<1.0.0",
    "tabulate>=0.9.0",
    "tenacity>=8.0,<10.0",
    "pytz>=2025.1",
]

[project.optional-dependencies]
snowflake = ["dbt-snowflake>=1.8,<2.0.0"]
bigquery = ["dbt-bigquery>=1.8,<2.0.0"]
redshift = ["dbt-redshift>=1.8,<2.0.0"]
postgres = ["dbt-postgres>=1.8,<2.0.0"]
databricks = ["dbt-databricks>=1.8,<2.0.0"]
spark = ["dbt-spark>=1.8,<2.0.0"]
athena = [
    "dbt-athena-community>=1.8,<2.0.0",
    # dbt-athena 1.10.x is incompatible with PyAthena 3.35+; remove when dbt-athena ships boto3 connection manager.
    "pyathena>=2.25,<3.35",
]
clickhouse = ["dbt-clickhouse>=1.8,<2.0.0"]
trino = ["dbt-trino>=1.8,<2.0.0"]
duckdb = ["dbt-duckdb>=1.8,<2.0.0"]
dremio = ["dbt-dremio>=1.8,<2.0.0"]
fabric = ["dbt-fabric>=1.8,<2.0.0"]
sqlserver = ["dbt-sqlserver>=1.8,<2.0.0"]
# dbt-fabricspark and dbt-vertica are intentionally not extras, because they pin outdated
# transitive dependencies (dbt-core==1.8.5, azure-cli pre-release) that block security
# patches for deepdiff, protobuf, and pyopenssl. Users who need these adapters can still
# install them directly (e.g. uv pip install dbt-fabricspark dbt-vertica).
all = [
    "elementary-data[snowflake,bigquery,redshift,postgres,databricks,spark,athena,clickhouse,trino,duckdb,dremio,fabric,sqlserver]",
]

[project.urls]
Homepage = "https://www.elementary-data.com"
Repository = "https://github.com/elementary-data/elementary"
Documentation = "https://docs.elementary-data.com"

[project.scripts]
edr = "elementary.cli.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-parametrization>=2022.2.1",
    "pre-commit",
    # Pinned below 1.16 because mypy >=1.16 crashes with INTERNAL ERROR on this codebase.
    "mypy<1.16",
    "deepdiff",
    # MyPy stubs
    "types-requests",
    "networkx-stubs",
    "types-python-dateutil",
    "boto3-stubs",
    "google-auth-stubs",
    "ratelimit-stubs",
    "types-google-cloud-ndb",
    "types-protobuf",
    "types-pytz",
    "types-jsonschema",
    "types-PyYAML",
    "types-setuptools",
    "types-retry",
    "types-decorator",
    "types-tabulate",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.15.0"]
build-backend = "uv_build"

# Security floors for transitive dependencies we don't import ourselves. They live here
# rather than in [project.dependencies] so we don't force version bounds on everyone who
# installs elementary-data; constraints still apply to everything we ship and test, i.e.
# uv.lock, the Docker image and CI, since `uv pip install .` honors them too.
[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",  # via requests, which caps the major itself
    "idna>=3.15",  # via requests, floored to address CVE-2026-45409 (GHSA-65pc-fj4g-8rjx) ReDoS in idna.encode()
    "pyasn1>=0.6.4",  # via google-auth/pyasn1-modules, floored to address BER/CER/DER decoder DoS advisories
    "cryptography>=50.0.0",  # via google-auth/azure-storage-blob, floored to address CVE-2026-69247 (PKCS#7 Bleichenbacher oracle)
]

[tool.uv.build-backend]
module-root = ""
module-name = "elementary"
